name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The gate has to judge pull requests too, or auto-merge has nothing to wait
  # on. This filter is the one ci.yml carried, copied unchanged, so PR coverage
  # is exactly what it was before that file was folded in here.
  pull_request:
    branches: [main]
  # Required by the post-merge dispatch in dependabot-auto-merge below: a merge
  # made with GITHUB_TOKEN raises no push event, so this is the only trigger
  # that can ship the merged result.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keyed by ref, NOT a bare `pages`. Now that pull_request is a trigger, a bare
  # group with cancel-in-progress lets a PR run cancel a live main deploy, and a
  # cancelled run ships nothing while looking like nothing went wrong.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # All ten tsx suites: the range-proof core, boundaries, serialization,
      # true aggregation, batch verification, extras, the inner-product
      # argument, proof soundness, the UI smoke pass and the static a11y
      # check. Deploy previously ran only test:a11y (Playwright), so none of
      # the nine correctness suites gated a publish — a build whose proofs
      # verified nothing could ship as long as the page passed axe.
      - name: Correctness suites
        run: npm test
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Accessibility gate (axe-core, WCAG A/AA)
        run: npm run test:a11y
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # Negated against pull_request, deliberately, rather than matched against
    # the push event. Those two read as equivalent and are not: matching on
    # push alone also skips workflow_dispatch, which is the trigger the
    # post-merge dispatch below depends on -- the dispatched run would build,
    # pass the whole gate, and then skip this job, so the site would still
    # never update. A pull request is tested here, never published.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Dependabot only. `needs: build` names the SAME job the deploy depends on --
  # that identity is the whole point of this file. This job used to live in
  # ci.yml and hung off ci.yml's lighter build-and-test, so a bump only had to
  # clear npm ci + npm test + npm run build to merge itself, while the publish
  # path also had to clear the Playwright/axe browser gate. Majors are excluded
  # from the npm group in dependabot.yml -- the 2026-08-18 batch had to hold
  # back 109 bumps and they were overwhelmingly majors (@noble v2 dropped
  # export subpaths, TypeScript 7, vitest 4), so those still want a human.
  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # actions: write is required by the deploy dispatch below. Without it the
      # dispatch returns HTTP 403 "Resource not accessible by integration", and
      # because that step ends in a `|| echo "::warning::"` the job still goes
      # green while the merged bump never ships.
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      # Majors included on purpose. `needs:` above already required the whole
      # gate to pass, and that gate -- unit tests, build, axe WCAG and the e2e
      # claims -- judges a bump far better than its version number does. A major
      # that actually breaks this lab fails the gate and stays open for a human.
      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              exit 0
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          echo "::warning::gate passed but the merge did not land after 3 attempts;"
          echo "::warning::leaving this PR open - Dependabot will rebase and retry."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
      # them so workflows cannot retrigger themselves -- so deploy would never run
      # and the site would keep serving the previous build. Ask for it explicitly;
      # a workflow_dispatch through the API is not suppressed. The dispatched run
      # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
      # deploy.yml is this file, and after the consolidation it is the only
      # workflow this repo has -- so the dispatched name cannot drift off a file
      # that no longer exists.
      - name: Deploy the merged result
        if: success()
        run: |
          if gh pr view "$PR_URL" --json state --jq .state | grep -q MERGED; then
            gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
              || echo "::warning::deploy dispatch failed; run deploy.yml by hand"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# verify: throwaway PR to prove the gate judges pull requests. Reverted with the branch.
